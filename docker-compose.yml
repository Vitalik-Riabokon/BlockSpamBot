services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: 8080
      CLOUDFLARED_AUTO_START: 0
      BOT_LOCK_PATH: /tmp/bot.lock
      TUNNEL_LOG_PATH: /app/main/data/cloudflared.out.log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - bot_data:/app/main/data

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    init: true
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    environment:
      CLOUDFLARED_TARGET_URL: http://bot:8080
      TUNNEL_LOG_PATH: /shared/cloudflared.out.log
    healthcheck:
      test: ["CMD-SHELL", "test -s /shared/cloudflared.out.log && grep -q 'trycloudflare.com' /shared/cloudflared.out.log"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - bot_data:/shared

  prometheus:
    image: prom/prometheus:v3.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - docker-metrics-exporter

  grafana:
    image: grafana/grafana-oss:11.6.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  docker-metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: bayreuthukraine
      DOCKER_METRICS_EXPORTER_PORT: 9200
      DOCKER_METRICS_EXPORTER_INTERVAL: 10
    ports:
      - "${DOCKER_METRICS_EXPORTER_BIND_PORT:-9200}:9200"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: ["monitoring-linux"]
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring-linux"]
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  bot_data:
  prometheus_data:
  grafana_data:
